<!-- Save as flames-low-uniform.svg or paste inline -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" preserveAspectRatio="none" width="100%" height="28">
  <defs>
    <linearGradient id="fg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ff7a2d"></stop>
      <stop offset="60%" stop-color="#ff3b2e"></stop>
      <stop offset="100%" stop-color="#cf1f1f"></stop>
    </linearGradient>
    <linearGradient id="inner" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ff9a4a" stop-opacity="0.95"></stop>
      <stop offset="100%" stop-color="#ff5a3a" stop-opacity="0.95"></stop>
    </linearGradient>
  </defs>

  <!-- Base rectangle to force a clean bottom line -->
  <rect x="0" y="44" width="1200" height="16" fill="url(#fg)"></rect>

  <!-- Main silhouette: low, even apex height (apex at y=6) -->
  <path d="
    M0 44
    L0 44
    C 28 44, 40 20, 70 20
    C100 20, 120 8, 150 8
    C180 8, 200 22, 230 22
    C260 22, 280 10, 310 10
    C340 10, 360 20, 390 20
    C420 20, 440 8, 470 8
    C500 8, 520 20, 550 20
    C580 20, 600 8, 630 8
    C660 8, 680 20, 710 20
    C740 20, 760 8, 790 8
    C820 8, 840 20, 870 20
    C900 20, 920 8, 950 8
    C980 8, 1000 20, 1030 20
    C1060 20, 1080 8, 1110 8
    C1140 8, 1160 20, 1188 20
    L1200 44
    Z" fill="url(#fg)"></path>

  <!-- Inner lighter shapes for depth; keep them below the apex line so overall top remains uniform -->
  <path d="
    M30 44
    C55 44, 68 30, 95 30
    C120 30, 140 18, 165 18
    C190 18, 210 30, 235 30
    C260 30, 280 18, 305 18
    C330 18, 350 30, 375 30
    C400 30, 420 18, 445 18
    C470 18, 490 30, 515 30
    C540 30, 560 18, 585 18
    C610 18, 630 30, 655 30
    C680 30, 700 18, 725 18
    C750 18, 770 30, 795 30
    C820 30, 840 18, 865 18
    C890 18, 910 30, 935 30
    C960 30, 980 18, 1005 18
    C1030 18, 1050 30, 1075 30
    C1100 30, 1120 18, 1145 18
    L1145 44
    Z" fill="url(#inner)" opacity="0.95"></path>

  <!-- subtle top highlight band (very thin) -->
  <path d="M0 20 L1200 20 L1200 18 L0 18 Z" fill="#ffb079" opacity="0.06"></path>

  <!-- optional subtle shadow under flame edge to enhance separation from nav -->
  <rect x="0" y="44" width="1200" height="2" fill="rgba(0,0,0,0.12)"></rect>
</svg>
